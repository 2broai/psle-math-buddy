# Merli Math Buddy API — Cloudflare Worker + D1 (free tier).
# Deploy: npm run deploy   (needs CLOUDFLARE_API_TOKEN with Workers Scripts + D1 write)
name = "merli-math-api"
main = "worker.js"
compatibility_date = "2025-09-01"
account_id = "cd047f55106f69655c835cc803404d20"
workers_dev = true

[vars]
# Sites allowed to call the API from a browser (comma-separated).
ALLOWED_ORIGINS = "https://2broai.github.io,http://localhost:8080,http://127.0.0.1:8080"

[[d1_databases]]
binding = "DB"
database_name = "merli-math-db"
database_id = "32f7cd0a-b5b2-4615-8ec8-57b371c0f2aa"

[observability]
enabled = true
